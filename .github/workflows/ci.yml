name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref. A queue of stale builds on a branch
# nobody is looking at any more is just noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 IS THE FLOOR, and the exact pin matters.
        #
        # Type stripping landed in 22.6.0 but BEHIND `--experimental-strip-types`.
        # It became the default in 22.18.0. The previous matrix tested 22.6 and
        # 22.x, which failed with `ERR_UNKNOWN_FILE_EXTENSION: Unknown file
        # extension ".ts"` — proving that an earlier README claim ("Node 22.6+")
        # was simply false. Testing the exact claimed floor is what caught it, so
        # the pin stays exact rather than becoming a range that would drift away
        # from the claim.
        node: ['22.18.0', '24.x']
        os: [ubuntu-latest]
        include:
          # One Windows and one macOS run, to catch path and line-ending bugs
          # without multiplying the whole matrix.
          - node: '24.x'
            os: windows-latest
          - node: '24.x'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Report environment
        run: |
          node --version
          npm --version

      # `--include=dev` regardless of local npm configuration: a machine with
      # `omit=dev` set globally would otherwise install nothing and silently
      # skip the type check.
      - name: Install dev dependencies
        run: npm install --include=dev

      - name: Type check
        run: npx tsc --noEmit

      # No build step and no transpilation: Node runs the TypeScript directly.
      # If this fails, the floor version claim in the README is wrong.
      - name: Run tests
        run: npm test

  determinism:
    name: Determinism
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dev dependencies
        run: npm install --include=dev

      # The architecture claims that the same seed replays the same mental
      # trajectory. That claim is either checkable in CI or it is marketing.
      - name: The demo must be reproducible
        shell: bash
        run: |
          node src/cli.ts demo --seed 1234 --quiet > /tmp/run-a.txt
          node src/cli.ts demo --seed 1234 --quiet > /tmp/run-b.txt
          if ! diff -q /tmp/run-a.txt /tmp/run-b.txt > /dev/null; then
            echo "::error::the same seed produced a different trajectory"
            diff /tmp/run-a.txt /tmp/run-b.txt || true
            exit 1
          fi
          echo "same seed, identical trajectory"

      - name: Different seeds must diverge
        shell: bash
        run: |
          node src/cli.ts demo --seed 1234 --quiet > /tmp/seed-a.txt
          node src/cli.ts demo --seed 9876 --quiet > /tmp/seed-b.txt
          if diff -q /tmp/seed-a.txt /tmp/seed-b.txt > /dev/null; then
            echo "::error::two different seeds produced identical output — the seed is not reaching the RNG"
            exit 1
          fi
          echo "different seeds, different trajectories"

  example:
    name: Examples run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # The examples are documentation that cannot rot, but only if something
      # checks that they still run.
      - name: Run the quickstart
        run: node examples/quickstart.ts

      - name: CLI responds to every documented command
        run: |
          node src/cli.ts help > /dev/null
          node src/cli.ts inspect > /dev/null
          node src/cli.ts inspect --json | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
          node src/cli.ts bench --cycles 50 > /dev/null
          echo "all commands responded"

  zero-dependencies:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The badge on the README makes a claim. This job enforces it, because a
      # claim that nothing checks is a claim that will quietly stop being true.
      - name: Assert package.json declares no runtime dependencies
        shell: bash
        run: |
          node -e '
            const pkg = require("./package.json");
            const runtime = Object.keys(pkg.dependencies ?? {});
            if (runtime.length > 0) {
              console.error("::error::runtime dependencies were added: " + runtime.join(", "));
              process.exit(1);
            }
            const dev = Object.keys(pkg.devDependencies ?? {});
            console.log("runtime: 0 dependencies");
            console.log("dev:     " + dev.length + " (" + dev.join(", ") + ")");
          '

      - name: Assert no import creates a dependency
        shell: bash
        run: |
          # Every import in src/ must be a relative path or a node: builtin. An
          # accidental bare specifier would be a dependency the badge lies about.
          #
          # Done in Node rather than grep, because the previous grep was wrong:
          # `from ['"][^./]` demands that the quote be immediately followed by a
          # non-dot, so `import type { X } from '../foo.ts'` — which has a SPACE
          # before the quote — was reported as a violation. A check that fires on
          # correct code is worse than no check, because it teaches people to
          # ignore it.
          #
          # Comments are stripped first so that prose quoting an import is not
          # mistaken for one.
          node -e '
            const fs = require("fs"), path = require("path");
            const offenders = [];
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir)) {
                const full = path.join(dir, entry);
                if (fs.statSync(full).isDirectory()) { walk(full); continue; }
                if (!entry.endsWith(".ts")) continue;
                const text = fs.readFileSync(full, "utf8")
                  .replace(/\/\*[\s\S]*?\*\//g, "")
                  .replace(/(^|[^:])\/\/[^\n]*/g, "$1");
                for (const m of text.matchAll(/^\s*(?:import|export)\s[^\n]*?from\s+["\x27]([^"\x27]+)["\x27]/gm)) {
                  const s = m[1];
                  if (s.startsWith(".") || s.startsWith("node:")) continue;
                  offenders.push(full + " imports \"" + s + "\"");
                }
              }
            };
            walk("src");
            if (offenders.length > 0) {
              console.error("::error::non-relative, non-builtin imports found:");
              for (const o of offenders) console.error("  " + o);
              process.exit(1);
            }
            console.log("every src/ import is relative or a node: builtin");
          '

  container:
    name: Container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A Dockerfile that nothing builds is a Dockerfile that stops working the
      # first time somebody renames a directory. This job is the only thing that
      # verifies the image, and it was added because the image was the one
      # deliverable with no check behind it at all.
      - name: Build the image
        run: docker build -t logos:ci .

      - name: The image runs the worked scenario
        run: |
          docker run --rm logos:ci demo --quiet > /tmp/container-demo.txt
          if ! grep -q "cycles" /tmp/container-demo.txt; then
            echo "::error::the demo produced no summary inside the container"
            cat /tmp/container-demo.txt
            exit 1
          fi
          tail -4 /tmp/container-demo.txt

      - name: The image runs every documented command
        run: |
          docker run --rm logos:ci help > /dev/null
          docker run --rm logos:ci inspect > /dev/null
          docker run --rm logos:ci inspect --json | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
          docker run --rm logos:ci bench --cycles 50 > /dev/null
          echo "all commands responded inside the container"

      - name: The container is deterministic too
        run: |
          docker run --rm logos:ci demo --seed 1234 --quiet > /tmp/c-a.txt
          docker run --rm logos:ci demo --seed 1234 --quiet > /tmp/c-b.txt
          if ! diff -q /tmp/c-a.txt /tmp/c-b.txt > /dev/null; then
            echo "::error::the container is not reproducible from its seed"
            diff /tmp/c-a.txt /tmp/c-b.txt || true
            exit 1
          fi
          echo "same seed, identical trajectory inside the container"

      - name: The image carries no installed dependencies
        run: |
          # The image deliberately runs `npm install` never. If node_modules ever
          # appears in it, something was added that the project claims not to have.
          if docker run --rm --entrypoint sh logos:ci -c 'test -d /logos/node_modules'; then
            echo "::error::the image contains node_modules, but the kernel has no runtime dependencies"
            exit 1
          fi
          echo "no node_modules in the image, as claimed"

      - name: The image does not run as root
        run: |
          whoami_in_container=$(docker run --rm --entrypoint sh logos:ci -c 'id -un')
          echo "container user: $whoami_in_container"
          if [ "$whoami_in_container" = "root" ]; then
            echo "::error::the container runs as root"
            exit 1
          fi
